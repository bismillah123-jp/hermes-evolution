# Eclipse Ops — dashboard theme buat Hermes
# Install: copy ke ~/.hermes/dashboard-themes/ lalu pilih di theme switcher (ikon palet di header).
# Drop-in, awet tiap `hermes update`. Docs: extending-the-dashboard.md (upstream).

name: eclipse-ops
label: Eclipse Ops
description: "Command-center theme — deep space canvas, cyan systems, amber alerts. Chamfered cards, scanlines, zero fluff."

palette:
  background: "#04070d"
  midground: "#c9e8f5"
  foreground:
    hex: "#ffb224"
    alpha: 0.9
  warmGlow: "rgba(255, 178, 36, 0.10)"
  noiseOpacity: 0.35

typography:
  fontSans: '"Space Grotesk", "Inter", system-ui, -apple-system, sans-serif'
  fontMono: '"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace'
  fontDisplay: '"Space Grotesk", "Inter", system-ui, sans-serif'
  fontUrl: "https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
  baseSize: "14px"
  lineHeight: "1.55"
  letterSpacing: "0.01em"

layout:
  radius: "0.375rem"
  density: comfortable

layoutVariant: tiled

componentStyles:
  card:
    clipPath: "polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px)"
    background: "linear-gradient(160deg, rgba(13, 25, 43, 0.92), rgba(4, 7, 13, 0.96))"
    boxShadow: "inset 0 0 0 1px rgba(103, 232, 249, 0.14), 0 10px 36px rgba(0, 0, 0, 0.5)"
  header:
    background: "linear-gradient(180deg, rgba(8, 15, 28, 0.98), rgba(4, 7, 13, 0.94))"
    boxShadow: "inset 0 -1px 0 rgba(103, 232, 249, 0.20)"
  tab:
    clipPath: "polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%)"
  badge:
    boxShadow: "inset 0 0 0 1px rgba(103, 232, 249, 0.28)"
  progress:
    background: "linear-gradient(90deg, #22d3ee, #818cf8)"
  footer:
    background: "rgba(4, 7, 13, 0.9)"

colorOverrides:
  primary: "#22d3ee"
  primaryForeground: "#04070d"
  accent: "#ffb224"
  accentForeground: "#04070d"
  ring: "#22d3ee"
  border: "rgba(103, 232, 249, 0.16)"
  success: "#34d399"
  warning: "#fbbf24"
  destructive: "#fb4d6d"
  mutedForeground: "#7d8fa8"
  card: "rgba(10, 18, 32, 0.92)"
  input: "rgba(103, 232, 249, 0.07)"

customCSS: |
  /* ---- Eclipse Ops: selector-level chrome ---- */

  /* teks seleksi */
  ::selection { background: rgba(34, 211, 238, 0.35); color: #eaf7ff; }

  /* scrollbar ramping */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: rgba(4, 7, 13, 0.6); }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, rgba(34, 211, 238, 0.45), rgba(34, 211, 238, 0.18));
    border-radius: 8px;
    border: 2px solid rgba(4, 7, 13, 0.6);
  }
  ::-webkit-scrollbar-thumb:hover { background: rgba(34, 211, 238, 0.65); }

  /* scanline overlay halus di seluruh dashboard */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 90;
    background: repeating-linear-gradient(to bottom,
      transparent 0px, transparent 3px,
      rgba(103, 232, 249, 0.022) 4px, rgba(103, 232, 249, 0.022) 5px);
    mix-blend-mode: screen;
  }

  /* tombol primary: glow pas hover */
  button[data-variant="primary"]:hover, .btn-primary:hover {
    box-shadow: 0 0 18px rgba(34, 211, 238, 0.45);
    filter: brightness(1.1);
  }

  /* card: garis tepi menyala lembut pas hover */
  [data-slot="card"]:hover {
    box-shadow: inset 0 0 0 1px rgba(103, 232, 249, 0.35), 0 10px 36px rgba(0, 0, 0, 0.5);
    transition: box-shadow 0.25s ease;
  }

  /* heading: tracking tegas */
  h1, h2, h3 { letter-spacing: 0.04em; }

  /* kode/inline: amber lembut biar kebaca di atas gelap */
  code { color: #ffd88a; }

  /* fokus keyboard yang jelas */
  :focus-visible { outline: 2px solid rgba(34, 211, 238, 0.7); outline-offset: 2px; }
